services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bonjou
    ports:
      - "5432:5432"
    volumes:
      - bonjou_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bonjou"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bonjou?schema=public
      PORT: 3000
      NODE_ENV: production
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-change-me-local-verify-token}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mock}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "3000:3000"

volumes:
  bonjou_pgdata:
